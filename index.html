<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Snakes and ladders up paper tiers, with a deck of 25 cards that bend the board, the dice and your rivals.">
<title>Cards, Snakes &amp; Ladders</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='10' fill='%23fffdf8' stroke='%23c9473a' stroke-width='4'/%3E%3Ccircle cx='22' cy='22' r='5' fill='%23c9473a'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23c9473a'/%3E%3Ccircle cx='42' cy='42' r='5' fill='%23c9473a'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f1ea; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 16px; background: #f4f1ea; color: #3b342d; font: 600 18px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; transition: opacity .5s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .track { width: min(260px, 70vw); height: 6px; border-radius: 3px; background: #e2dccf; overflow: hidden; }
  #bar { width: 0; height: 100%; background: #c9473a; transition: width .3s; }
  #label { font-weight: 400; font-size: 14px; color: #6b6259; }
  #loading.error #label { color: #c9473a; }

  /* a text field the game draws on its canvas: while it is typed into, a real input lies on the box (web/textfield.js) */
  .tf { position: fixed; z-index: 5; box-sizing: border-box; margin: 0; border: 0; border-radius: 10px; outline: none; background: transparent; caret-color: #2d3a6b; -webkit-user-select: text; user-select: text; -webkit-appearance: none; appearance: none; }
  .tf::selection { background: rgba(45,58,107,.22); }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="loading">
  <div>Cards, Snakes &amp; Ladders</div>
  <div class="track"><div id="bar"></div></div>
  <div id="label">loading</div>
</div>
<noscript>This game needs JavaScript.</noscript>
<script type="module" src="./web/p0web.js"></script>
</body>
</html>
