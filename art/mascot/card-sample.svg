<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560">
  <title>Фишка — пример карты</title>
  <defs>
    <filter id="card-drawn" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="9" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="3" xChannelSelector="R" yChannelSelector="G" result="wobbly"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="2" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.17  0 0 0 0 0.13  0 0 0 0 0.2  -2 0 0 0 0.85" result="specks"/>
      <feComposite in="specks" in2="wobbly" operator="in" result="grain"/>
      <feMerge><feMergeNode in="wobbly"/><feMergeNode in="grain"/></feMerge>
    </filter>
    <clipPath id="card-art"><rect x="30" y="30" width="300" height="430" rx="14"/></clipPath>
  </defs>

  <g filter="url(#card-drawn)" stroke="#2b2233" stroke-linejoin="round" stroke-linecap="round">
    <rect x="12" y="12" width="336" height="466" rx="26" fill="#fbf1d0" stroke-width="6"/>

    <g clip-path="url(#card-art)">
      <rect x="30" y="30" width="300" height="430" fill="#4f8fd6" stroke="none"/>
      <g fill="#7fb2f0" stroke="none">
        <path d="M40 60 C80 40 120 70 110 100 C100 130 50 120 30 140 Z"/>
        <path d="M200 40 C240 50 260 90 300 80 C320 75 330 60 340 60 L340 30 L200 30 Z"/>
        <path d="M250 150 C280 130 320 150 330 180 C335 210 300 220 280 205 C260 190 230 170 250 150 Z"/>
        <path d="M60 220 C90 200 120 230 100 260 C85 280 50 270 45 250 C42 238 48 228 60 220 Z"/>
        <path d="M290 280 C310 270 330 290 330 310 L330 340 C310 335 280 320 282 300 C283 290 285 284 290 280 Z"/>
        <path d="M150 140 C170 128 190 140 186 156 C182 170 160 172 150 164 C143 158 143 146 150 140 Z"/>
      </g>
      <g fill="#ffd36b" stroke="none">
        <circle cx="270" cy="110" r="4"/><circle cx="80" cy="170" r="3"/><circle cx="215" cy="215" r="3.5"/><circle cx="120" cy="60" r="3"/>
      </g>

      <!-- лестница уходит вверх -->
      <g id="ladder">
        <g fill="none">
          <path d="M70 420 L130 420 M80 370 L140 370 M90 320 L150 320 M100 270 L160 270 M110 220 L170 220 M120 170 L180 170 M130 120 L190 120 M140 70 L200 70" stroke-width="15"/>
          <path d="M70 420 L130 420 M80 370 L140 370 M90 320 L150 320 M100 270 L160 270 M110 220 L170 220 M120 170 L180 170 M130 120 L190 120 M140 70 L200 70" stroke="#e6ad5c" stroke-width="7"/>
          <path d="M58 470 L152 0 M122 470 L216 0" stroke-width="20"/>
          <path d="M58 470 L152 0 M122 470 L216 0" stroke="#b8732f" stroke-width="11"/>
        </g>
      </g>

      <!-- холм -->
      <path d="M24 400 C90 378 150 412 220 396 C280 382 316 400 338 392 L338 470 L24 470 Z" fill="#f2a3a0" stroke-width="5"/>
      <path d="M52 440 c-6 -14 10 -22 16 -12 c4 8 -6 12 -8 6 M300 448 c6 -14 -10 -22 -16 -12 c-4 8 6 12 8 6 M118 452 c-4 -10 8 -16 12 -9" fill="none" stroke-width="4"/>

      <!-- змея подглядывает -->
      <g id="snake">
        <path d="M262 480 C268 440 336 448 326 404 C318 370 286 378 292 352" fill="none" stroke-width="33"/>
        <path d="M262 480 C268 440 336 448 326 404 C318 370 286 378 292 352" fill="none" stroke="#3fae49" stroke-width="22"/>
        <path d="M262 480 C268 440 336 448 326 404 C318 370 286 378 292 352" fill="none" stroke="#256b2c" stroke-width="5" stroke-dasharray="2 14"/>
        <path d="M279 340 L268 334 M279 340 L270 347" fill="none" stroke="#e53935" stroke-width="3"/>
        <path d="M285 340 L277 340" fill="none" stroke="#e53935" stroke-width="3"/>
        <ellipse cx="298" cy="336" rx="24" ry="17" fill="#3fae49" stroke-width="5"/>
        <circle cx="292" cy="328" r="7.5" fill="#fff" stroke-width="3.5"/>
        <circle cx="289.5" cy="329.5" r="3.2" fill="#2b2233" stroke="none"/>
      </g>

      <!-- маскот -->
      <svg x="70" y="172" width="224" height="280" viewBox="0 0 400 500">
<defs>
    <clipPath id="clip-body"><path d="M168 262 C165 318 142 370 128 410 L272 410 C258 370 235 318 232 262 Z"/></clipPath>
    <clipPath id="clip-base"><path d="M118 412 Q118 402 130 402 L270 402 Q282 402 282 412 L285 438 Q287 450 273 450 L127 450 Q113 450 115 438 Z"/></clipPath>
    <clipPath id="clip-collar"><ellipse cx="200" cy="258" rx="58" ry="15"/></clipPath>
    <clipPath id="clip-head"><circle cx="200" cy="168" r="84"/></clipPath>
    <clipPath id="clip-mouth"><path d="M180 196 Q205 204 230 194 Q228 228 205 229 Q183 229 180 196 Z"/></clipPath>
  </defs>

  <ellipse cx="200" cy="466" rx="105" ry="10" fill="#2b2233" opacity="0.18"/>

  <g id="mascot" stroke="#2b2233" stroke-linejoin="round" stroke-linecap="round">

    <!-- ножки, выглядывают из-под подставки -->
    <g id="feet" fill="#5c6677" stroke-width="6">
      <ellipse cx="166" cy="455" rx="24" ry="12"/>
      <ellipse cx="234" cy="455" rx="24" ry="12"/>
    </g>

    <!-- левая рука машет -->
    <g id="arm-left">
      <path d="M176 300 C136 302 108 282 100 242" fill="none" stroke-width="21"/>
      <path d="M176 300 C136 302 108 282 100 242" fill="none" stroke="#e5483a" stroke-width="8"/>
      <ellipse cx="117" cy="232" rx="9" ry="6" transform="rotate(-35 117 232)" fill="#fff4dc" stroke-width="5"/>
      <ellipse cx="98" cy="221" rx="17" ry="20" fill="#fff4dc" stroke-width="6"/>
      <path d="M92 204 L92 213 M103 203 L103 212" fill="none" stroke-width="4"/>
      <path d="M66 214 Q60 200 66 186 M54 222 Q44 202 52 180" fill="none" stroke-width="5"/>
    </g>

    <!-- правая рука держит кубик -->
    <g id="arm-right">
      <path d="M224 300 C262 304 290 298 306 280" fill="none" stroke-width="21"/>
      <path d="M224 300 C262 304 290 298 306 280" fill="none" stroke="#e5483a" stroke-width="8"/>
      <g id="die" stroke-width="5">
        <path d="M310 212 L336 225 L310 238 L284 225 Z" fill="#fffaf0"/>
        <path d="M284 225 L310 238 L310 268 L284 255 Z" fill="#f1dfb4"/>
        <path d="M310 238 L336 225 L336 255 L310 268 Z" fill="#dcc08a"/>
        <g fill="#2b2233" stroke="none">
          <ellipse cx="310" cy="225" rx="5.5" ry="3.2" fill="#e5483a"/>
          <ellipse cx="290" cy="236" rx="3" ry="4"/>
          <ellipse cx="304" cy="257" rx="3" ry="4"/>
          <ellipse cx="316" cy="258" rx="3" ry="4"/>
          <ellipse cx="323" cy="246.5" rx="3" ry="4"/>
          <ellipse cx="330" cy="235" rx="3" ry="4"/>
        </g>
      </g>
      <ellipse cx="312" cy="273" rx="20" ry="12" fill="#fff4dc" stroke-width="6"/>
      <ellipse cx="292" cy="262" rx="8" ry="6" transform="rotate(30 292 262)" fill="#fff4dc" stroke-width="5"/>
    </g>

    <!-- корпус фишки -->
    <g id="body">
      <path d="M168 262 C165 318 142 370 128 410 L272 410 C258 370 235 318 232 262 Z" fill="#e5483a" stroke="none"/>
      <g clip-path="url(#clip-body)" stroke="none">
        <path d="M214 262 C220 320 238 370 248 410 L300 410 L300 262 Z" fill="#b3302c"/>
        <path d="M181 276 C178 320 162 364 150 400 L164 400 C174 366 188 322 191 276 Z" fill="#f6876a"/>
      </g>
      <path d="M168 262 C165 318 142 370 128 410 L272 410 C258 370 235 318 232 262 Z" fill="none" stroke-width="7"/>
    </g>

    <!-- подставка -->
    <g id="base">
      <path d="M118 412 Q118 402 130 402 L270 402 Q282 402 282 412 L285 438 Q287 450 273 450 L127 450 Q113 450 115 438 Z" fill="#e5483a" stroke="none"/>
      <g clip-path="url(#clip-base)" stroke="none">
        <rect x="80" y="430" width="240" height="30" fill="#b3302c"/>
        <rect x="238" y="400" width="80" height="60" fill="#b3302c"/>
        <path d="M132 409 L215 409" stroke="#f6876a" stroke-width="5"/>
      </g>
      <path d="M118 412 Q118 402 130 402 L270 402 Q282 402 282 412 L285 438 Q287 450 273 450 L127 450 Q113 450 115 438 Z" fill="none" stroke-width="7"/>
    </g>

    <!-- воротничок -->
    <g id="collar">
      <ellipse cx="200" cy="258" rx="58" ry="15" fill="#e5483a" stroke="none"/>
      <path d="M140 262 Q200 290 260 262 L260 280 L140 280 Z" fill="#b3302c" stroke="none" clip-path="url(#clip-collar)"/>
      <ellipse cx="200" cy="258" rx="58" ry="15" fill="none" stroke-width="7"/>
    </g>

    <!-- хохолок-искра -->
    <g id="tuft">
      <path d="M184 96 C176 72 184 56 197 50 C195 63 199 71 204 76 C208 58 220 46 236 48 C223 59 221 76 222 96 Z" fill="#f7c548" stroke-width="6"/>
      <path d="M208 92 C208 80 212 70 220 62" fill="none" stroke="#d99a22" stroke-width="5"/>
    </g>

    <!-- голова -->
    <g id="head">
      <circle cx="200" cy="168" r="84" fill="#b3302c" stroke="none"/>
      <g clip-path="url(#clip-head)" stroke="none">
        <circle cx="190" cy="158" r="80" fill="#e5483a"/>
        <ellipse cx="156" cy="116" rx="24" ry="10" transform="rotate(-38 156 116)" fill="#f6876a"/>
        <ellipse cx="135" cy="146" rx="5" ry="7" fill="#f6876a"/>
      </g>
      <circle cx="200" cy="168" r="84" fill="none" stroke-width="7"/>
    </g>

    <!-- лицо -->
    <g id="face">
      <ellipse cx="148" cy="197" rx="13" ry="8" fill="#f49aa0" stroke="none"/>
      <ellipse cx="258" cy="193" rx="13" ry="8" fill="#f49aa0" stroke="none"/>

      <path d="M155 126 Q170 116 186 123" fill="none" stroke-width="6"/>
      <path d="M215 120 Q232 110 249 119" fill="none" stroke-width="6"/>

      <ellipse cx="172" cy="158" rx="19" ry="24" fill="#ffffff" stroke-width="6"/>
      <ellipse cx="230" cy="156" rx="21" ry="26" fill="#ffffff" stroke-width="6"/>
      <circle cx="179" cy="162" r="9" fill="#2b2233" stroke="none"/>
      <circle cx="237" cy="160" r="10" fill="#2b2233" stroke="none"/>
      <circle cx="182" cy="158" r="3" fill="#ffffff" stroke="none"/>
      <circle cx="240" cy="156" r="3.4" fill="#ffffff" stroke="none"/>

      <g id="mouth">
        <path d="M180 196 Q205 204 230 194 Q228 228 205 229 Q183 229 180 196 Z" fill="#3a1f2b" stroke="none"/>
        <g clip-path="url(#clip-mouth)" stroke="none">
          <path d="M178 194 Q205 204 232 192 L232 204 Q205 214 178 206 Z" fill="#ffffff"/>
          <ellipse cx="207" cy="230" rx="17" ry="11" fill="#f07a8a"/>
        </g>
        <path d="M180 196 Q205 204 230 194 Q228 228 205 229 Q183 229 180 196 Z" fill="none" stroke-width="6"/>
      </g>
    </g>
  </g>
</svg>
    </g>

    <rect x="30" y="30" width="300" height="430" rx="14" fill="none" stroke-width="5"/>

    <g id="index">
      <path d="M30 76 A46 46 0 0 0 76 30 L44 30 Q30 30 30 44 Z" fill="#fbf1d0" stroke-width="5"/>
      <path d="M330 414 A46 46 0 0 0 284 460 L316 460 Q330 460 330 446 Z" fill="#fbf1d0" stroke-width="5"/>
    </g>
  </g>
  <g fill="#2b2233" font-family="Futura, 'Century Gothic', 'Trebuchet MS', sans-serif" font-weight="600">
    <text x="47" y="60" font-size="26" text-anchor="middle">6</text>
    <text x="313" y="440" font-size="26" text-anchor="middle" transform="rotate(180 313 431)">6</text>
    <text x="180" y="522" font-size="24" letter-spacing="7" text-anchor="middle">ФИШКА</text>
  </g>
  <path d="M140 542 L220 542" stroke="#2b2233" stroke-width="3" stroke-linecap="round"/>
</svg>
