<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Hand — значок категории</title>
  <!-- Сделано art/cards/cardart.py (cat-C); правьте там и пересоберите. -->
  <defs>
    <filter id="cat-C-drawn" filterUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="13" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2" xChannelSelector="R" yChannelSelector="G" result="wobbly"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="21" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.17  0 0 0 0 0.13  0 0 0 0 0.2  -2 0 0 0 0.85" result="specks"/>
      <feComposite in="specks" in2="wobbly" operator="in" result="grain"/>
      <feMerge><feMergeNode in="wobbly"/><feMergeNode in="grain"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cat-C-drawn)" stroke="#2b2233" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(64 101) rotate(-26) scale(1.0)"><rect x="-28" y="-80" width="56" height="80" rx="9" fill="#fff4dc" stroke-width="6.0"/><rect x="-19" y="-71" width="38" height="62" rx="5" fill="none" stroke="#cdaf5e" stroke-width="4"/><path d="M0 -56 L11 -40 L0 -24 L-11 -40 Z" fill="#b58a12" stroke-width="4"/></g><g transform="translate(64 101) rotate(0) scale(1.0)"><rect x="-28" y="-80" width="56" height="80" rx="9" fill="#fff4dc" stroke-width="6.0"/><rect x="-19" y="-71" width="38" height="62" rx="5" fill="none" stroke="#cdaf5e" stroke-width="4"/><path d="M0 -56 L11 -40 L0 -24 L-11 -40 Z" fill="#b58a12" stroke-width="4"/></g><g transform="translate(64 101) rotate(26) scale(1.0)"><rect x="-28" y="-80" width="56" height="80" rx="9" fill="#fff4dc" stroke-width="6.0"/><rect x="-19" y="-71" width="38" height="62" rx="5" fill="none" stroke="#cdaf5e" stroke-width="4"/><path d="M0 -56 L11 -40 L0 -24 L-11 -40 Z" fill="#b58a12" stroke-width="4"/></g>
  </g>
</svg>
