<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Movement — значок категории</title>
  <!-- Сделано art/cards/cardart.py (cat-M); правьте там и пересоберите. -->
  <defs>
    <filter id="cat-M-drawn" filterUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2" xChannelSelector="R" yChannelSelector="G" result="wobbly"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.17  0 0 0 0 0.13  0 0 0 0 0.2  -2 0 0 0 0.85" result="specks"/>
      <feComposite in="specks" in2="wobbly" operator="in" result="grain"/>
      <feMerge><feMergeNode in="wobbly"/><feMergeNode in="grain"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cat-M-drawn)" stroke="#2b2233" stroke-linejoin="round" stroke-linecap="round">
    <clipPath id="im-arrow"><path d="M30 50 L70 50 L70 28 L116 64 L70 100 L70 78 L30 78 Z"/></clipPath>
<path d="M30 50 L70 50 L70 28 L116 64 L70 100 L70 78 L30 78 Z" fill="#e8743b" stroke="none"/>
<path d="M0 66 L128 66 L128 128 L0 128 Z" fill="#b35d39" stroke="none" clip-path="url(#im-arrow)"/>
<path d="M30 50 L70 50 L70 28 L116 64 L70 100 L70 78 L30 78 Z" fill="none" stroke-width="7"/>
<path d="M36 57 L66 57 M76 42 L96 58" fill="none" stroke="#efa07a" stroke-width="5"/>
<path d="M6 46 L20 46 M2 64 L20 64 M6 82 L20 82" fill="none" stroke-width="7"/>
  </g>
</svg>
