<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Protection — значок категории</title>
  <!-- Сделано art/cards/cardart.py (cat-P); правьте там и пересоберите. -->
  <defs>
    <filter id="cat-P-drawn" filterUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2" xChannelSelector="R" yChannelSelector="G" result="wobbly"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.17  0 0 0 0 0.13  0 0 0 0 0.2  -2 0 0 0 0.85" result="specks"/>
      <feComposite in="specks" in2="wobbly" operator="in" result="grain"/>
      <feMerge><feMergeNode in="wobbly"/><feMergeNode in="grain"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cat-P-drawn)" stroke="#2b2233" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(64 64) rotate(0) scale(1.02)"><path d="M0 -56 L42 -42 Q40 20 0 56 Q-40 20 -42 -42 Z" fill="#cdaf5e" stroke-width="6.9"/><clipPath id="shield-64"><path d="M0 -42 L30 -32 Q28 14 0 42 Q-28 14 -30 -32 Z"/></clipPath><path d="M0 -42 L30 -32 Q28 14 0 42 Q-28 14 -30 -32 Z" fill="#2b8fd6" stroke="none"/><path d="M0 -50 L0 50 L50 50 L50 -50 Z" fill="#2b70a8" stroke="none" clip-path="url(#shield-64)"/><path d="M0 -42 L30 -32 Q28 14 0 42 Q-28 14 -30 -32 Z" fill="none" stroke-width="4.9"/><path d="M-24 -26 Q-24 -32 -14 -35" fill="none" stroke="#6fb3e3" stroke-width="4.9"/><path d="M-15 0 L-3 13 L17 -12" fill="none" stroke-width="16.7"/><path d="M-15 0 L-3 13 L17 -12" fill="none" stroke="#fff4dc" stroke-width="7.8"/><path d="M-36 -40 L-8 -50" fill="none" stroke="#ffffff" stroke-width="3.9"/><g fill="#b58a12" stroke-width="2.9"><circle cx="0" cy="-49" r="3"/><circle cx="36" cy="-38" r="3"/><circle cx="-36" cy="-38" r="3"/><circle cx="0" cy="48" r="3"/></g></g>
  </g>
</svg>
