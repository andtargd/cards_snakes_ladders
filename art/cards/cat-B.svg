<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Board — значок категории</title>
  <!-- Сделано art/cards/cardart.py (cat-B); правьте там и пересоберите. -->
  <defs>
    <filter id="cat-B-drawn" filterUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2" xChannelSelector="R" yChannelSelector="G" result="wobbly"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="15" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.17  0 0 0 0 0.13  0 0 0 0 0.2  -2 0 0 0 0.85" result="specks"/>
      <feComposite in="specks" in2="wobbly" operator="in" result="grain"/>
      <feMerge><feMergeNode in="wobbly"/><feMergeNode in="grain"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cat-B-drawn)" stroke="#2b2233" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(64 64) scale(1.12) translate(-64 -64)"><g transform="translate(55.5 104) rotate(12)" fill="none"><path d="M-17.0 -20 L17.0 -20 M-17.0 -40 L17.0 -40 M-17.0 -60 L17.0 -60" stroke-width="17"/><path d="M-17.0 -20 L17.0 -20 M-17.0 -40 L17.0 -40 M-17.0 -60 L17.0 -60" stroke="#2a8263" stroke-width="7"/><path d="M-17.0 0 L-17.0 -80 M17.0 0 L17.0 -80" stroke-width="22"/><path d="M-17.0 0 L-17.0 -80 M17.0 0 L17.0 -80" stroke="#2aa876" stroke-width="10"/><path d="M-18.0 -10 L-18.0 -48" stroke="#6ec4a2" stroke-width="4"/></g></g>
  </g>
</svg>
