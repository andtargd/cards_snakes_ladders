<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Hinder — значок категории</title>
  <!-- Сделано art/cards/cardart.py (cat-H); правьте там и пересоберите. -->
  <defs>
    <filter id="cat-H-drawn" filterUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="9" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2" xChannelSelector="R" yChannelSelector="G" result="wobbly"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.17  0 0 0 0 0.13  0 0 0 0 0.2  -2 0 0 0 0.85" result="specks"/>
      <feComposite in="specks" in2="wobbly" operator="in" result="grain"/>
      <feMerge><feMergeNode in="wobbly"/><feMergeNode in="grain"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cat-H-drawn)" stroke="#2b2233" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="64" cy="64" r="44" fill="#fff4dc" stroke="none"/>
<circle cx="64" cy="64" r="44" fill="none" stroke-width="26"/><path d="M33 33 L95 95" fill="none" stroke-width="26"/><circle cx="64" cy="64" r="44" fill="none" stroke="#d64545" stroke-width="13"/><path d="M33 33 L95 95" fill="none" stroke="#d64545" stroke-width="13"/>
<path d="M34 46 A36 36 0 0 1 48 31" fill="none" stroke="#e38181" stroke-width="5"/>
  </g>
</svg>
