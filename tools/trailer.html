<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailer</title>
<!--
  The CrazyGames video: a game played to a script, recorded from the game's own canvas, no cursor, no sound,
  at the game's own pace. Needs tools/server.py (it saves through /save/).
  tools/trailer.html?size=1920x1080&rec=frames&out=tmp/trailer
    size   1920x1080 (16:9) or 1080x1620 (2:3); the game runs at that size in an iframe, DPR 1
    rec    frames: every frame a JPEG, <out>/<size>/f00001.jpg (for ffmpeg; steady whatever the machine does)
           webm:   canvas.captureStream + MediaRecorder, paced in real time, <out>/trailer-<size>.webm
                   (keep the page in sight while it records: a hidden page gets its timers slowed)
           none:   plays the script and reports its timing
    out    tmp/trailer (default) or docs/crazygames/media; cover: the cover's composition (tools/cover.js)
    every  frames: only every n-th one, for a quick look; script: another board where the story plays out
  The script: a board and a start where, at the rules' own dice and draws (found below before the take),
  Juniper climbs a ladder to the last tier, the player swaps places with her (Swap Places), she then slides
  down a snake, and the player rolls home. The first half second is the cover.
  Frames to video (ffmpeg):
    ffmpeg -framerate 30 -i tmp/trailer/1920x1080/f%05d.jpg -c:v libx264 -pix_fmt yuv420p -crf 18 -preset slow -movflags +faststart -an docs/crazygames/media/trailer-1920x1080.mp4
  Results: window.result, await window.done.
-->
<style>
  html, body { margin: 0; background: #20232a; color: #ddd; font: 13px system-ui, sans-serif; }
  #log { white-space: pre-wrap; padding: 8px; }
  #holder { position: absolute; left: 0; top: 0; opacity: 0.02; pointer-events: none; }
  iframe { border: 0; display: block; }
  #out { display: block; max-width: 100%; max-height: 70vh; margin: 8px; background: #000; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/build/three.module.js",
  "three/addons/": "../vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="log"></div>
<canvas id="out"></canvas>
<div id="holder"></div>
<script type="module">
import * as R from '../experience/rules.js'
import { renderCover } from './cover.js'

const q = new URLSearchParams(location.search)
const [W, H] = (q.get('size') || '1920x1080').split('x').map(Number)
const FPS = +q.get('fps') || 30
const rec = q.get('rec') || 'frames'
const EVERY = +q.get('every') || 1 // frames: only every n-th one (a quick look)
const out = (q.get('out') || 'tmp/trailer').replace(/^\/+|\/+$/g, '')
const COVER = 0.5, FADE = 0.35 // seconds of the cover, then of its fade into the game (the script starts as it fades)
const TAIL = 1.4 // seconds after the piece reaches the finish (the confetti, the winner's line)
// the last move: the camera comes down in front of the last tier and looks along it to the finish (from, at; seconds),
// on a tall screen steeper, the last tier high in the picture over the tiers below it
const FINALE = W > H ? { from: [-2.8, 7.0, -1.4], at: [-3.0, 3.0, -5.6], secs: 1.2 } : { from: [-2.6, 5.6, -1.4], at: [-2.6, 2.3, -3.6], secs: 1.2 }
const SCRIPT = 3 // which of the boards where the story plays out (?script=n tries others)
const logEl = document.getElementById('log')
const log = t => { logEl.textContent += t + '\n'; console.log('[trailer]', t) }
const sleep = ms => new Promise(r => setTimeout(r, ms))

// ---------- the script ----------
const ME = 0, JUNIPER = 1
const NAMES = ['Paper Fox', 'Juniper']
const isEl = (els, c) => els.some(e => e[1] === c || e[2] === c)

/** The table as the take begins: Juniper's turn, the player holding Swap Places and Extra Die. */
function opening(seed, r, J, Y) {
  const s = R.createGame({ seed, mode: 'champion', players: NAMES.map((n, i) => ({ n, b: i ? 2 : 0, id: i ? null : 1, c: i ? 1 : 0 })), cells: 100 })
  s.pl = NAMES.map((n, i) => ({ n, b: i ? 2 : 0, id: i ? null : 1, c: i ? 1 : 0, pos: i ? J : Y, h: i ? [] : ['M3', 'D1'], d: 0, fx: {}, st: i ? J : Y, tr: '' }))
  Object.assign(s, { cur: JUNIPER, ph: 'main', rolled: false, played: false, round: 11, turnNo: 21, seq: 0, log: [], r })
  delete s.ev0
  return s
}
/** A bot's whole turn as the game would play it: [{ seat, a, ev }], or null when the rules refuse a step. */
function botTurn(s) {
  const seat = s.cur, steps = []
  for (let g = 0; g < 12 && s.cur === seat && s.ph !== 'over'; g++) {
    const a = R.botAction(s, seat), res = R.apply(s, seat, a)
    if (!res.ok) return null
    steps.push({ seat, a, ev: res.ev })
  }
  return steps
}
const has = (steps, e, p) => steps.some(st => st.ev.some(x => x.e === e && (p == null || x.p === p)))

/**
 * The script for the board of `seed`, generator position r: Juniper's start J and the player's Y, and the
 * steps, or null when the rules' dice and draws do not tell this story from there.
 */
function tryScript(seed, r, els) {
  // 1. Juniper climbs a long ladder (35 cells or more, all told) to the last tier (94 to 99)
  for (let J = 40; J < 94; J++) {
    if (isEl(els, J)) continue
    const s1 = opening(seed, r, J, 30)
    const t1 = botTurn(s1)
    if (!t1 || !has(t1, 'ladder', JUNIPER) || s1.pl[JUNIPER].pos < 94 || s1.pl[JUNIPER].pos > 99 || s1.pl[JUNIPER].pos - J < 35 || s1.cur !== ME) continue
    // 2. the player swaps places with her; 3. she slides down a snake from where the player stood; 4. the player rolls home
    for (let Y = 30; Y < 80; Y++) {
      if (isEl(els, Y) || Math.abs(Y - J) < 4) continue
      const s = opening(seed, r, J, Y)
      const steps = botTurn(s)
      if (!steps || s.pl[ME].pos !== Y) continue
      const swap = s.pl[ME].h.indexOf('M3')
      if (s.cur !== ME || s.ph !== 'main' || swap < 0) continue
      let res = R.apply(s, ME, { t: 'play', i: swap, tg: JUNIPER })
      if (!res.ok || s.cur !== JUNIPER || s.pl[ME].pos < 94) continue
      steps.push({ seat: ME, a: { t: 'play', i: swap, tg: JUNIPER }, ev: res.ev, card: 'M3' })
      const t3 = botTurn(s)
      if (!t3 || !has(t3, 'snake', JUNIPER) || has(t3, 'play') || s.cur !== ME || s.pl[ME].pos < 94 || s.pl[JUNIPER].pos >= Y) continue
      steps.push(...t3)
      if (s.ph !== 'main') continue
      res = R.apply(s, ME, { t: 'roll' })
      if (!res.ok || s.ph !== 'over' || s.res?.winner !== ME) continue
      steps.push({ seat: ME, a: { t: 'roll' }, ev: res.ev })
      return { seed, r, J, Y, start: opening(seed, r, J, Y), steps }
    }
  }
  return null
}
/** The n-th board (by seed, in a fixed order) with a long ladder to the last tier where the story plays out. */
function findScript(n = 1) {
  const rand = R.mulberry32(20261021)
  for (let seed = 1; seed < 400; seed++) {
    const els = R.generateBoard(seed, 100)
    // a ladder from the middle of the board up to the last tier: a long climb
    if (!els.some(e => e[0] === 1 && e[2] >= 94 && e[2] <= 99 && e[2] - e[1] >= 18)) continue
    for (let k = 0; k < 60; k++) {
      const script = tryScript(seed, (rand() * 2 ** 32) >>> 0, els)
      if (script && --n <= 0) return script
      if (script) break
    }
  }
  throw new Error('no script found')
}

// ---------- the take ----------
async function loadGame() {
  const holder = document.getElementById('holder')
  const f = document.createElement('iframe')
  f.style.width = W + 'px'; f.style.height = H + 'px'
  holder.append(f)
  f.src = '../index.html?' + new URLSearchParams({ dpr: '1', clock: 'manual', sid: 'trailer' })
  const t0 = performance.now()
  for (;;) {
    const w = f.contentWindow
    if (w?.__csl && w.__cslStep) return w
    if (performance.now() - t0 > 40000) throw new Error('the game did not load')
    await sleep(50)
  }
}

window.done = (async () => {
  const script = findScript(+q.get('script') || SCRIPT)
  log(`script: board ${script.seed}, Juniper on ${script.J}, the player on ${script.Y}, ${script.steps.length} steps`)
  await document.fonts.ready
  const cover = renderCover(q.get('cover') || 'slant', W, H)
  const w = await loadGame()
  // the game's own randomness (the bots' pauses, the confetti) the same in every take
  w.Math.random = R.mulberry32(7)
  const app = w.__csl, ui = app.ui, view = app.view, canvas = w.document.getElementById('c')
  // no sound (the video has none), though the speaker on screen shows it on
  app.playSound = () => {}
  app.sound.on = true
  // the take changes the game's settings in this browser (the First Match counts as done): put them back after
  const settings = w.localStorage.getItem('csl-settings')
  const errors = []
  w.addEventListener('error', e => errors.push(e.message))
  const ce = w.console.error
  w.console.error = (...a) => { errors.push(a.map(String).join(' ')); ce.apply(w.console, a) }
  const step = dt => w.__cslStep(dt)
  // the table: the game's own Solo Play, its state replaced by the script's start
  app.first = 'done'
  app.startLocal({ mode: 'champion', humans: 1, names: [], bots: 1, level: 2, size: 100 })
  const table = app.table
  table.s = JSON.parse(JSON.stringify(script.start))
  table.s.pl[ME].id = app.p0.me.id
  table.s.gid = script.seed
  table.update = () => {} // the bots play the script's moves (as the game would have)
  table.save = () => {} // nothing of the take is kept in this browser
  ui.logLines = []
  view.tasks = []
  view.setState(JSON.parse(JSON.stringify(table.s)), { players: app.p0.players })
  view.speed = 1
  // the camera: the whole board first, then down to Juniper as the cover fades
  view.overview()
  for (let i = 0; i < 90; i++) step(1 / 30)
  view.distWant = 7.5
  view.focusOn(JUNIPER)

  // the camera as the game moves it, and for the last move as the script does: from the game's own, gliding
  // to FINALE (the picture's shift that keeps a piece clear of the hand fades out on the way)
  let shot = null
  const gameCamera = view.updateCamera.bind(view), cam = app.p0.camera
  const from = cam.position.clone().set(...FINALE.from), at = cam.position.clone().set(...FINALE.at)
  view.updateCamera = dt => {
    gameCamera(dt)
    if (!shot) return
    shot.t = Math.min(1, shot.t + dt / FINALE.secs)
    const k = shot.t < 0.5 ? 2 * shot.t * shot.t : 1 - (-2 * shot.t + 2) ** 2 / 2
    const look = view.focus.clone(); look.z -= 0.6 // where the game's camera looks
    cam.position.lerp(from, k)
    cam.lookAt(look.lerp(at, k))
    if (cam.view) cam.setViewOffset(W, H, cam.view.offsetX * (1 - k), cam.view.offsetY * (1 - k), W, H)
    cam.updateMatrixWorld()
  }

  // the steps, each when the table has settled and its pause is over
  const plan = []
  for (const st of script.steps) {
    if (st.seat !== ME) plan.push({ wait: plan.length ? 0.25 : 0.05, run: () => bot(st) })
    // (the dice glow under the pointer that is not drawn, then roll; the camera goes to the finish for the last move)
    else if (st.a.t === 'roll') plan.push({ wait: 0.25, run: () => { ui.hover = 'tray'; ui.dirty = true; shot = { t: 0 } } }, { wait: 0.35, run: () => { ui.hover = null; app.act({ t: 'roll' }) } })
    else plan.push({ wait: 0.3, run: () => pickCard(st) }, { wait: 0.7, run: () => ui.chooseTarget(st.a.tg) })
  }
  function bot(st) {
    const s = table.s, a = R.botAction(s, st.seat)
    if (JSON.stringify(a) !== JSON.stringify(st.a)) throw new Error('off the script: ' + JSON.stringify(a))
    const res = R.apply(s, st.seat, a)
    if (!res.ok) throw new Error(res.err)
    table.after(res.ev)
  }
  function pickCard(st) {
    const c = ui.cards.find(k => k.kind === 'hand' && k.id === st.card)
    if (!c) throw new Error('no ' + st.card + ' in the hand')
    ui.cardClicked(c)
  }

  const outCanvas = document.getElementById('out')
  outCanvas.width = W; outCanvas.height = H
  const g = outCanvas.getContext('2d')
  let recorder = null, chunks = [], track = null
  if (rec === 'webm') {
    const stream = outCanvas.captureStream(0)
    track = stream.getVideoTracks()[0]
    const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m))
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16e6 })
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data) }
    recorder.start()
  }
  const saving = new Set()
  // (a few at once; the local server now and then drops a connection: try again)
  async function post(path, blob) {
    for (let tries = 1; ; tries++) {
      try {
        const r = await fetch('/save/' + path, { method: 'POST', body: blob })
        if (r.ok) return
        throw new Error('save ' + path + ': ' + r.status)
      } catch (e) { if (tries >= 4) throw e; await sleep(200 * tries) }
    }
  }
  async function save(path, blob) {
    while (saving.size >= 4) await Promise.race(saving)
    const p = post(path, blob).finally(() => saving.delete(p))
    saving.add(p)
  }

  // the end: the piece reaches the finish on screen
  const dt = 1 / FPS
  let k = 0, wait = 0, overAt = null, t = 0
  const onOver = view.listeners.over
  view.listeners.over = (...a) => { overAt ??= t; onOver?.(...a) }
  const t0 = performance.now(), marks = []
  let frame = 0
  for (; ; frame++) {
    t = frame * dt
    // the script runs as the cover fades
    if (t >= COVER) {
      if (!view.busy && app.waiting <= 0 && k < plan.length) {
        if ((wait += dt) >= plan[k].wait) { plan[k].run(); marks.push(t.toFixed(2)); k++; wait = 0 }
      }
    }
    step(dt)
    if (overAt != null && t - overAt >= TAIL) break
    if (t > 40) throw new Error('the take ran too long')
    g.globalAlpha = 1
    g.drawImage(canvas, 0, 0, W, H)
    if (t < COVER + FADE) { g.globalAlpha = t < COVER ? 1 : 1 - (t - COVER) / FADE; g.drawImage(cover, 0, 0); g.globalAlpha = 1 }
    if (rec === 'frames' && frame % EVERY === 0) {
      const blob = await new Promise(r => outCanvas.toBlob(r, 'image/jpeg', 0.95))
      await save(`${out}/${W}x${H}/f${String(frame + 1).padStart(5, '0')}.jpg`, blob)
    } else if (rec === 'webm') {
      track.requestFrame()
      const due = t0 + (frame + 1) * 1000 * dt
      while (performance.now() < due) await sleep(Math.max(0, due - performance.now() - 1))
    } else if (frame % 15 === 0) await sleep(0)
    if (frame % 30 === 0) log(`t ${t.toFixed(1)} s, step ${k}/${plan.length}`)
  }
  const frames = frame
  await Promise.all(saving)
  let file = null
  if (recorder) {
    const stopped = new Promise(r => { recorder.onstop = r })
    recorder.stop(); await stopped
    const blob = new Blob(chunks, { type: 'video/webm' })
    file = `${out}/trailer-${W}x${H}.webm`
    await save(file, blob); await Promise.all(saving)
  }
  try { w.localStorage.removeItem('csl-game'); if (settings == null) w.localStorage.removeItem('csl-settings'); else w.localStorage.setItem('csl-settings', settings) } catch {}
  const result = { size: `${W}x${H}`, seconds: +(frames / FPS).toFixed(2), frames, steps: marks, errors, file, wall: Math.round(performance.now() - t0) }
  log(JSON.stringify(result))
  window.result = result
  return result
})().catch(e => { log('failed: ' + (e?.stack || e)); throw e })
</script>
</body>
</html>
